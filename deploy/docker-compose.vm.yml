x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ghcp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:-ghcp}"
    volumes:
      - "${POSTGRES_DATA_DIR:?POSTGRES_DATA_DIR is required}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghcp} -d ${POSTGRES_DB:-ghcp}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ghcp-proxy
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - "${REDIS_DATA_DIR:?REDIS_DATA_DIR is required}:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ghcp-proxy
    logging: *default-logging

  migration:
    image: "${MIGRATION_IMAGE:?MIGRATION_IMAGE is required}"
    user: "0:0"
    restart: "no"
    environment:
      MIGRATION_POSTGRES_DSN_FILE: /run/ghcp/migration-postgres-dsn
      MIGRATION_TARGET_VERSION: "${SCHEMA_VERSION:?SCHEMA_VERSION is required}"
      MIGRATION_PHASE: expand
    volumes:
      - "${MIGRATION_DSN_HOST_FILE:-/dev/null}:/run/ghcp/migration-postgres-dsn:ro"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ghcp-proxy
    logging: *default-logging

  gateway:
    image: "${GATEWAY_IMAGE:?GATEWAY_IMAGE is required}"
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${GATEWAY_BIND_ADDR:-127.0.0.1}:${GATEWAY_PORT:-8000}:8000"
    environment:
      CONFIG_FILE: "/etc/ghcp/config.yaml"
      GATEWAY_ADDR: ":8000"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required}"
      ORG_SYNC_ENABLED: "${ORG_SYNC_ENABLED:-false}"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-ghcp}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ghcp}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      BUDGET_MAX_RPM_PER_ACCOUNT: "${BUDGET_MAX_RPM_PER_ACCOUNT:-60}"
      BUDGET_MAX_RPM_GLOBAL: "${BUDGET_MAX_RPM_GLOBAL:-6000}"
      BUDGET_MAX_DAILY_TOKENS_PER_ACCOUNT: "${BUDGET_MAX_DAILY_TOKENS_PER_ACCOUNT:-0}"
      BUDGET_MAX_DAILY_TOKENS_GLOBAL: "${BUDGET_MAX_DAILY_TOKENS_GLOBAL:-0}"
      BUDGET_MAX_DAILY_NANO_AIU_PER_ACCOUNT: "${BUDGET_MAX_DAILY_NANO_AIU_PER_ACCOUNT:-0}"
      BUDGET_MAX_DAILY_NANO_AIU_GLOBAL: "${BUDGET_MAX_DAILY_NANO_AIU_GLOBAL:-0}"
      CREDENTIAL_KEY_VERSION: "${CREDENTIAL_KEY_VERSION:-vm}"
      CREDENTIAL_MASTER_KEY: "${CREDENTIAL_MASTER_KEY:?CREDENTIAL_MASTER_KEY is required}"
    volumes:
      - "${APP_CONFIG_FILE:?APP_CONFIG_FILE is required}:/etc/ghcp/config.yaml:ro"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ghcp-proxy
    logging: *default-logging

  admin:
    image: "${ADMIN_IMAGE:?ADMIN_IMAGE is required}"
    restart: unless-stopped
    ports:
      - "${ADMIN_BIND_ADDR:-127.0.0.1}:${ADMIN_PORT:-8001}:8001"
    environment:
      CONFIG_FILE: "/etc/ghcp/config.yaml"
      ADMIN_ADDR: ":8001"
      GATEWAY_ADDR: ":8000"
      WORKER_METRICS_ADDR: ":8002"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required}"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-ghcp}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ghcp}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      BUDGET_MAX_RPM_PER_ACCOUNT: "${BUDGET_MAX_RPM_PER_ACCOUNT:-60}"
      BUDGET_MAX_RPM_GLOBAL: "${BUDGET_MAX_RPM_GLOBAL:-6000}"
      BUDGET_MAX_DAILY_TOKENS_PER_ACCOUNT: "${BUDGET_MAX_DAILY_TOKENS_PER_ACCOUNT:-0}"
      BUDGET_MAX_DAILY_TOKENS_GLOBAL: "${BUDGET_MAX_DAILY_TOKENS_GLOBAL:-0}"
      BUDGET_MAX_DAILY_NANO_AIU_PER_ACCOUNT: "${BUDGET_MAX_DAILY_NANO_AIU_PER_ACCOUNT:-0}"
      BUDGET_MAX_DAILY_NANO_AIU_GLOBAL: "${BUDGET_MAX_DAILY_NANO_AIU_GLOBAL:-0}"
      CREDENTIAL_KEY_VERSION: "${CREDENTIAL_KEY_VERSION:-vm}"
      CREDENTIAL_MASTER_KEY: "${CREDENTIAL_MASTER_KEY:?CREDENTIAL_MASTER_KEY is required}"
    volumes:
      - "${APP_CONFIG_FILE:?APP_CONFIG_FILE is required}:/etc/ghcp/config.yaml:ro"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ghcp-proxy
    logging: *default-logging

  worker:
    image: "${WORKER_IMAGE:?WORKER_IMAGE is required}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORKER_METRICS_PORT:-8002}:8002"
    environment:
      CONFIG_FILE: "/etc/ghcp/config.yaml"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required}"
      ORG_SYNC_ENABLED: "${ORG_SYNC_ENABLED:-false}"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-ghcp}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ghcp}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      WORKER_METRICS_ADDR: ":8002"
      WORKER_ROLES: "${WORKER_ROLES:-all}"
      CREDENTIAL_KEY_VERSION: "${CREDENTIAL_KEY_VERSION:-vm}"
      CREDENTIAL_MASTER_KEY: "${CREDENTIAL_MASTER_KEY:?CREDENTIAL_MASTER_KEY is required}"
      GITHUB_TOKEN_FILE: "/run/secrets/ghcp/github-token"
    volumes:
      - "${APP_CONFIG_FILE:?APP_CONFIG_FILE is required}:/etc/ghcp/config.yaml:ro"
      - "${GITHUB_TOKEN_FILE:-/dev/null}:/run/secrets/ghcp/github-token:ro"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ghcp-proxy
    logging: *default-logging

networks:
  ghcp-proxy:
    name: "${COMPOSE_NETWORK_NAME:-ghcp-proxy-net}"