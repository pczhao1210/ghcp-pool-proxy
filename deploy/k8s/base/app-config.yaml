gateway:
  read_timeout: 30s
  read_header_timeout: 5s
  write_timeout: 0s
  idle_timeout: 120s
  probe_timeout: 2s
  drain_propagation_delay: 5s
  drain_timeout: 25s
  shutdown_timeout: 35s
  ready_snapshot_max_age: 90s

provider:
  type: fake
  base_url: ""
  timeout: 120s

health:
  enabled: true
  scheduler_poll_interval: 1s
  active_token_probe_interval: 60m
  degraded_token_probe_interval: 60s
  token_probe_timeout: 5s
  token_probe_claim_lease: 15s
  token_probe_concurrency: 5
  token_probe_starts_per_second: 2
  re_admission_cooldown: 5m
  upstream_probe_timeout: 15s
  upstream_probe_claim_lease: 30s
  recovery_task_claim_lease: 45s
  upstream_probe_concurrency: 2
  upstream_probe_starts_per_minute: 12
  probe_model: gpt-4o
  probe_upstream_api: chat_completions
  degrade_threshold: 70
  reactivate_threshold: 60
  quarantine_threshold: 90

postgres_pool:
  max_open_connections: 12
  max_conn_lifetime: 5m
  max_conn_idle_time: 5m

usage_writer:
  queue_size: 10000
  batch_size: 500
  flush_threshold: 100
  flush_interval: 250ms
  enqueue_timeout: 50ms
  write_timeout: 5s

maintenance:
  raw_retention_days: 7
  hourly_retention_days: 90
  daily_retention_months: 13
  partition_ahead_days: 7

logging:
  level: info
  format: json
  success_sample_rate: 0.01
