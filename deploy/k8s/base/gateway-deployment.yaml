apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghcp-gateway
  labels:
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
      app.kubernetes.io/part-of: ghcp-pool-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: ghcp-pool-proxy
        app.kubernetes.io/tier: application
    spec:
      serviceAccountName: ghcp-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: registry.invalid/ghcp-pool-proxy/gateway:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ghcp-runtime-env
            - secretRef:
                name: ghcp-runtime-secrets
          env:
            - name: CONFIG_FILE
              value: /etc/ghcp/config.yaml
            - name: GATEWAY_ADDR
              value: :8000
          volumeMounts:
            - name: app-config
              mountPath: /etc/ghcp
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: app-config
          configMap:
            name: ghcp-app-config
