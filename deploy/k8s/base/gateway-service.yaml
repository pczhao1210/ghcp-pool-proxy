apiVersion: v1
kind: Service
metadata:
  name: ghcp-gateway
  labels:
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: ghcp-pool-proxy
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
      appProtocol: http
