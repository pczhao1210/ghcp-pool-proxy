apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghcp-worker
  labels:
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/part-of: ghcp-pool-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: ghcp-pool-proxy
        app.kubernetes.io/tier: application
        ghcp-pool-proxy.io/worker-role: general
    spec:
      serviceAccountName: ghcp-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.invalid/ghcp-pool-proxy/worker:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ghcp-runtime-env
            - secretRef:
                name: ghcp-runtime-secrets
          env:
            - name: CONFIG_FILE
              value: /etc/ghcp/config.yaml
            - name: WORKER_METRICS_ADDR
              value: :8002
            - name: WORKER_PROBE_TIMEOUT
              value: 2s
            - name: WORKER_SHUTDOWN_TIMEOUT
              value: 5s
            - name: WORKER_ROLES
              value: credential-warning,health,usage-rollup,provider-attempts,budget-recovery,binding-expiry
            - name: CAPABILITY_SYNC_MATRIX_PATH
              value: /srv/ghcp/compatibility/matrix.json
          volumeMounts:
            - name: app-config
              mountPath: /etc/ghcp
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: app-config
          configMap:
            name: ghcp-app-config
        - name: tmp
          emptyDir: {}
