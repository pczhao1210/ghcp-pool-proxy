apiVersion: v1
kind: Service
metadata:
  name: ghcp-worker
  labels:
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: ghcp-pool-proxy
    ghcp-pool-proxy.io/worker-role: general
  ports:
    - name: metrics
      port: 8002
      targetPort: metrics
      protocol: TCP
      appProtocol: http
