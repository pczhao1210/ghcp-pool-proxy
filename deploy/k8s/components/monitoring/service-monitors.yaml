apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ghcp-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
      app.kubernetes.io/part-of: ghcp-pool-proxy
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      authorization:
        credentials:
          name: ghcp-runtime-secrets
          key: ADMIN_TOKEN
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ghcp-worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/part-of: ghcp-pool-proxy
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
