apiVersion: batch/v1
kind: Job
metadata:
  name: ghcp-migrate
  labels:
    app.kubernetes.io/component: migration
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: ghcp-pool-proxy
        app.kubernetes.io/tier: migration
    spec:
      restartPolicy: Never
      serviceAccountName: ghcp-migrate
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.invalid/ghcp-pool-proxy/migration:replace-me
          imagePullPolicy: IfNotPresent
          env:
            - name: MIGRATIONS_DIR
              value: /srv/ghcp/migrations
            - name: MIGRATION_POSTGRES_DSN_FILE
              value: /var/run/secrets/ghcp/migration/postgres-dsn
            - name: MIGRATION_TARGET_VERSION
              value: "19"
            - name: MIGRATION_PHASE
              value: expand
            - name: MIGRATION_LOCK_TIMEOUT
              value: 5m
            - name: PGAPPNAME
              value: ghcp-migrate
          volumeMounts:
            - name: migration-postgres-dsn
              mountPath: /var/run/secrets/ghcp/migration
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: migration-postgres-dsn
          secret:
            secretName: ghcp-migration-postgres-dsn
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
