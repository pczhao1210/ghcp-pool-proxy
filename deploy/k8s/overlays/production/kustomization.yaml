apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ghcp-system
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: ghcp-runtime-env
    behavior: merge
    literals:
      - PROVIDER=copilot
patches:
  - path: worker-capability-sync-patch.yaml
labels:
  - pairs:
      app.kubernetes.io/environment: production
    includeSelectors: false
    includeTemplates: true
